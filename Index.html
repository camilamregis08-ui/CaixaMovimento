<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Atividade Pseudo-Classe</Pseudo-Classe> <Pseudo-Classe></Pseudo-Classe>
    </title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Atividade Pseudo-Classe CSS</h1>

    <h2>1- Movimento na Vertical</h2>
    <div class="palco vertical">
      <div class="caixa caixa-vertical"></div>
    </div>

    <h2>2- Movimento na Horizontal</h2>
    <div class="palco horizontal">
      <div class="caixa caixa-horizontal"></div>
    </div>

    <h2>3- Movimento na Diagonal</h2>
    <div class="palco diagonal">
      <div class="caixa caixa-diagonal"></div>
    </div>

    <h2>4- Velocidade e Repetição</h2>
    <div class="palco etapas">
      <div class="caixa caixa-etapas">1</div>
      <div class="caixa caixa-etapas">3</div>
      <div class="caixa caixa-etapas">5</div>
    </div>
    <h2>5- Movimento em etapas</h2>

    <div class="palco movimento">
      <div class="caixa caixa-movimento"></div>
    </div>

    <div class="caixa" tabindex="0">TAB</div>
  </body>
</html>
